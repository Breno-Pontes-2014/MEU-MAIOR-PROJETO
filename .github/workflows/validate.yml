name: Validação Hotel Master

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r "Projeto (não deletar)/requirements.txt"

      - name: Verificar sintaxe
        run: python -m py_compile "Projeto (não deletar)/app.py" "Projeto (não deletar)/migrate_sqlite_to_postgres.py"
